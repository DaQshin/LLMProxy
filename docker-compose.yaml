version: "3.8"

services:
  db:
    image: postgres:latest
    restart: unless-stopped
    container_name: postgres-container
    environment:
      - POSTGRES_USER=postgres_admin
      - POSTGRES_PASSWORD=dbllmproxy
      - POSTGRES_DB=DB

    ports:
      - "5432:5432"
    volumes:
      - ./src/data/db:/var/lib/postgresql/data

  vector_db:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    container_name: qdrant-container
    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./src/data/vector_db:/var/lib/postgresql/data
